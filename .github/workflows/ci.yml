name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:validate
      # Balance gate (docs/systems/progression-economy.md): the phase-11 simulator fails when a
      # curve leaves its band. ~2 s, so it runs on every change (talents, Revelation and beyond).
      - run: pnpm --filter @mrak/core simulate
      # Headless bot: 12 nights × 50 seeds, no exceptions, soft-locks or impossible states.
      - run: pnpm --filter @mrak/core bot 12 50

  build:
    name: Build game and landing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg (audio encoding)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm --filter @mrak/game run assets --require-audio
      - run: pnpm turbo run build --filter=@mrak/game --filter=@mrak/landing
      # Client review (security item 9): no secrets/keys, no tokens in Web Storage, no source maps.
      # Paid content: the game build runs `check:demo` itself.
      - run: node tests/security/client-build.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: web-builds
          path: |
            apps/game/dist
            apps/landing/dist
          retention-days: 7

  e2e:
    name: Game E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mrak/game run assets
      - run: pnpm --filter @mrak/game exec playwright install --with-deps chromium
      - run: pnpm --filter @mrak/game e2e --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: apps/game/test-results

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

  migrations:
    name: Migration review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:ci@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mrak/online-api...
      - run: psql postgresql://postgres:ci@localhost:5432/postgres -c 'CREATE DATABASE shadow'
      - name: Migrations apply cleanly and match schema.prisma (no drift)
        working-directory: services/online-api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - name: Applied migrations are immutable; destructive SQL needs the `migration-reviewed` label
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          changed=$(git diff --name-status "$BASE" HEAD -- services/online-api/prisma/migrations)
          if echo "$changed" | grep -E '^[MDR]' ; then
            echo "::error::existing migrations must never be edited, renamed or deleted"; exit 1
          fi
          new=$(echo "$changed" | awk '$1=="A" && /migration.sql$/ {print $2}')
          [ -z "$new" ] && exit 0
          for f in $new; do echo "### $f"; cat "$f"; done >> "$GITHUB_STEP_SUMMARY"
          if grep -niE 'drop (table|column|index|constraint)|alter column .* (type|set not null)|rename (to|column)|truncate' $new; then
            case ",$LABELS," in
              *,migration-reviewed,*) echo "destructive SQL approved by label" ;;
              *) echo "::error::destructive migration (expand/contract, docs/runbooks/deploy.md): add the migration-reviewed label after review"; exit 1 ;;
            esac
          fi

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: |
          for d in infra/cloudflare infra/gcp; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
