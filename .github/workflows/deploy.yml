# Deploy (docs/runbooks/deploy.md, ADR 0012). A merge to main deploys staging automatically, then
# production after a reviewer approves the `production` environment. The approval page shows the
# migration SQL of the release. Rollback: run this workflow manually with action=rollback.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, rollback]
        default: deploy
      environment:
        type: choice
        options: [staging, production]
        default: staging
      release:
        description: 'rollback: commit SHA of the release to restore (its image is in GHCR)'
        required: false

permissions:
  contents: read
  packages: write # push the API images to GHCR

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build images
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.push.outputs.image }}
      migrate: ${{ steps.push.outputs.migrate }}
    steps:
      - uses: actions/checkout@v7
      # One GHCR package: `<sha>` is the API, `migrate-<sha>` the migration job.
      - name: API and migration images (built once, promoted to both environments)
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrak-online-api"
          label="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          docker build -f services/online-api/Dockerfile --target runtime --label "$label" \
            --build-arg RELEASE="$GITHUB_SHA" -t "$repo:$GITHUB_SHA" .
          docker build -f services/online-api/Dockerfile --target migrate --label "$label" \
            -t "$repo:migrate-$GITHUB_SHA" .
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$repo:$GITHUB_SHA"
          docker push "$repo:migrate-$GITHUB_SHA"
          echo "image=$repo:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "migrate=$repo:migrate-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Migration SQL of this release (shown before the production approval)
        run: |
          git fetch --depth=1 origin "${{ github.event.before || 'HEAD~1' }}" 2>/dev/null || true
          {
            echo '## Migrations in this release'
            git diff --name-only "${{ github.event.before || 'HEAD~1' }}" HEAD -- services/online-api/prisma/migrations \
              | grep 'migration.sql$' | while read -r f; do echo "### $f"; echo '```sql'; cat "$f"; echo '```'; done
          } >> "$GITHUB_STEP_SUMMARY" || echo 'No migrations.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ matrix.env }}
    needs: build
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: 1 # staging first; production waits for it and for its reviewers
      matrix:
        env: ${{ github.event_name == 'push' && fromJSON('["staging","production"]') || fromJSON(format('["{0}"]', inputs.environment)) }}
    environment: ${{ matrix.env }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      MIGRATE_IMAGE: ${{ needs.build.outputs.migrate }}
      ORIGIN: ${{ vars.API_ORIGIN }} # Render service URL (its /health is open for probes)
      BRANCH: ${{ matrix.env == 'production' && 'main' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
      - name: Migrate Neon (expand-only migrations; see the runbook)
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: docker run --rm -e DATABASE_URL "$MIGRATE_IMAGE"
      - name: Deploy the API image on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "PREVIOUS=$(curl -fsS --max-time 90 "$ORIGIN/health" | jq -r '.release // empty' || true)" >> "$GITHUB_ENV"
          curl -fsS -X POST --get --data-urlencode "imgURL=$IMAGE" "$HOOK" > /dev/null
      - name: Smoke test (new release answering); automatic rollback when it does not
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          for i in $(seq 1 60); do
            got=$(curl -fsS --max-time 20 "$ORIGIN/health" | jq -r '.release // empty' || true)
            [ "$got" = "$GITHUB_SHA" ] && echo "release $got is live" && exit 0
            sleep 10
          done
          echo "::error::release $GITHUB_SHA not live after 10 min"
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != dev ]; then
            prev="${IMAGE%:*}:$PREVIOUS"
            echo "rolling back to $prev"
            curl -fsS -X POST --get --data-urlencode "imgURL=$prev" "$HOOK" > /dev/null
          fi
          exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the static sites for ${{ matrix.env }} (API on the same origin, /api)
        env:
          PUBLIC_API_URL: /api
          PUBLIC_PLAY_URL: ${{ vars.PLAY_URL }}
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          PUBLIC_PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          VITE_API_URL: /api
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pnpm --filter @mrak/game run assets --require-audio
          pnpm turbo run build --filter=@mrak/game --filter=@mrak/landing
          node tests/security/client-build.mjs
      - name: Publish the landing (with its /api Function) to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/landing
          command: pages deploy dist --project-name=mrak-landing --branch=${{ env.BRANCH }} --commit-hash=${{ github.sha }}
      - name: Publish the game (with its /api Function) to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/game
          command: pages deploy dist --project-name=mrak-game --branch=${{ env.BRANCH }} --commit-hash=${{ github.sha }}
      - name: End-to-end check through the edge (Pages Function → Render)
        env:
          PLAY: ${{ vars.PLAY_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS --max-time 30 ${CF_ID:+-H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET"} \
              "$PLAY/api/health" | jq -r '.release // empty' || true)
            [ "$got" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "::error::$PLAY/api/health does not answer release $GITHUB_SHA (check API_ORIGIN and EDGE_SECRET on the Pages projects)"
          exit 1

  rollback:
    name: Roll back ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: API → the chosen release's image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          ORIGIN: ${{ vars.API_ORIGIN }}
          WANTED: ${{ inputs.release }}
        run: |
          [[ "$WANTED" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release must be a full commit SHA"; exit 1; }
          current=$(curl -fsS --max-time 90 "$ORIGIN/health" | jq -r '.release // empty' || true)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mrak-online-api:$WANTED"
          curl -fsS -X POST --get --data-urlencode "imgURL=$image" "$HOOK" > /dev/null
          for i in $(seq 1 60); do
            got=$(curl -fsS --max-time 20 "$ORIGIN/health" | jq -r '.release // empty' || true)
            [ "$got" = "$WANTED" ] && echo "API: $current → $WANTED" >> "$GITHUB_STEP_SUMMARY" && exit 0
            sleep 10
          done
          echo "::error::rollback to $WANTED not live after 10 min"; exit 1
      - name: Static sites → previous production deployment (production only)
        if: inputs.environment == 'production'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for p in mrak-landing mrak-game; do
            base="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/$p/deployments"
            prev=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$base?env=production" | jq -r '.result[1].id')
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$base/$prev/rollback" > /dev/null
            echo "$p → $prev" >> "$GITHUB_STEP_SUMMARY"
          done
