# Monthly restore drill (docs/runbooks/restore.md): restore the latest encrypted backup into a
# throw-away Postgres inside this job, verify it, and record the time. Production data never
# reaches staging, artifacts or logs (only row counts are printed). A failure alerts like any
# failed workflow; record results in docs/security/test-report.md.
name: Restore drill

on:
  schedule:
    - cron: '0 5 3 * *' # 3rd of every month, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v7
      - name: Latest backup, at most 48 h old
        run: |
          set -euo pipefail
          latest=$(aws s3 ls s3://mrak-backups/online/ --endpoint-url "$R2" | sort | tail -n1)
          [ -n "$latest" ] || { echo "::error::no backups"; exit 1; }
          when=$(echo "$latest" | awk '{print $1" "$2}')
          age_h=$(( ($(date -u +%s) - $(date -u -d "$when" +%s)) / 3600 ))
          [ "$age_h" -le 48 ] || { echo "::error::latest backup is ${age_h} h old"; exit 1; }
          echo "KEY=online/$(echo "$latest" | awk '{print $4}')" >> "$GITHUB_ENV"
          echo "AGE_H=$age_h" >> "$GITHUB_ENV"
      - name: Decrypt and restore into a throw-away Postgres 17
        env:
          AGE_KEY: ${{ secrets.BACKUP_AGE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client
          started=$(date +%s)
          docker run -d --name drill -e POSTGRES_PASSWORD=drill -e POSTGRES_DB=online -p 6543:5432 postgres:17-alpine
          until docker exec drill pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          aws s3 cp "s3://mrak-backups/$KEY" backup.dump.age --endpoint-url "$R2" --only-show-errors
          umask 077 && printf '%s\n' "$AGE_KEY" > age.key
          age -d -i age.key backup.dump.age | docker exec -i drill pg_restore -U postgres -d online --no-owner --no-privileges --exit-on-error
          rm -f age.key backup.dump.age
          echo "RESTORE_MINUTES=$(( ($(date +%s) - started) / 60 ))" >> "$GITHUB_ENV"
      - name: Verify
        run: |
          infra/postgres/verify-restore.sh "postgresql://postgres:drill@127.0.0.1:6543/online?sslmode=disable"
          echo "✔ Restore drill: $KEY (${AGE_H} h old), restore took ${RESTORE_MINUTES} min" >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy the throw-away database
        if: always()
        run: docker rm -f drill || true
