# Monthly backup restore drill in staging (docs/runbooks/restore.md): clone the staging database
# to a point in time 1 hour ago (Cloud SQL PITR), verify it, then delete the clone. A failure
# alerts like any failed workflow; record results in docs/security/test-report.md.
name: Restore drill

on:
  schedule:
    - cron: '0 5 3 * *' # 3rd of every month, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      REGION: ${{ vars.GCP_REGION }}
      SOURCE: ${{ vars.GCP_SQL_INSTANCE }}
      CLONE: restore-drill-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Point-in-time clone (1 h ago)
        run: |
          started=$(date +%s)
          pit=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
          gcloud sql instances clone "$SOURCE" "$CLONE" --point-in-time "$pit" --quiet
          echo "RESTORE_MINUTES=$(( ($(date +%s) - started) / 60 ))" >> "$GITHUB_ENV"
          echo "PIT=$pit" >> "$GITHUB_ENV"
      - name: Verify through the Cloud SQL Auth Proxy
        env:
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          curl -fsSLo proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.2/cloud-sql-proxy.linux.amd64
          chmod +x proxy
          conn=$(gcloud sql instances describe "$CLONE" --format='value(connectionName)')
          gcloud sql instances patch "$CLONE" --assign-ip --quiet # public IP only for the proxy, IAM-authorised; deleted below
          ./proxy "$conn" --port 6543 --auto-iam-authn=false & sleep 8
          MAX_AGE_HOURS=48 infra/gcp/verify-restore.sh "postgresql://online:${DB_PASSWORD}@127.0.0.1:6543/online?sslmode=disable"
          echo "✔ Restore drill: PITR $PIT, restore took ${RESTORE_MINUTES} min" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the clone
        if: always()
        run: gcloud sql instances delete "$CLONE" --quiet || true
