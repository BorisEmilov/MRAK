name: mrak

# Local development stack. All published ports bind to 127.0.0.1 only.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      ONLINE_DB_NAME: ${ONLINE_DB_NAME:?set in .env}
      ONLINE_DB_USER: ${ONLINE_DB_USER:?set in .env}
      ONLINE_DB_PASSWORD: ${ONLINE_DB_PASSWORD:?set in .env}
      STUDIO_DB_NAME: ${STUDIO_DB_NAME:?set in .env}
      STUDIO_DB_USER: ${STUDIO_DB_USER:?set in .env}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set in .env}', '--appendonly', 'yes']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  online-api:
    build:
      context: .
      dockerfile: services/online-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${ONLINE_DB_USER}:${ONLINE_DB_PASSWORD}@postgres:5432/${ONLINE_DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - '127.0.0.1:${ONLINE_API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  studio-api:
    build:
      context: .
      dockerfile: services/studio-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${STUDIO_DB_USER}:${STUDIO_DB_PASSWORD}@postgres:5432/${STUDIO_DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    # Internal tool: loopback only, never published on a public interface.
    ports:
      - '127.0.0.1:${STUDIO_API_PORT:-3100}:3100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  postgres-data:
  redis-data:
